<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Magical Classroom</title><style>
*{box-sizing:border-box}body{margin:0;background:#201033;color:#49345b;font-family:Trebuchet MS,Arial}header{background:#341b4e;color:#fff1d7;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}h1{font:700 27px Georgia;margin:0}nav{display:flex;gap:6px;flex-wrap:wrap}button{cursor:pointer;border:2px solid #e9c47c;background:#76459c;color:white;border-radius:12px;padding:10px;font-weight:bold}button:focus-visible{outline:4px solid #45d6f5}main{max-width:1550px;margin:auto;padding:10px}.scene{position:relative;border:3px solid #e7b96c;border-radius:16px;overflow:hidden}.scene img{display:block;width:100%}.hot{position:absolute;background:transparent;border:0;padding:0}.hot:hover,.hot:focus-visible{background:#fff5a533;box-shadow:inset 0 0 0 4px #ffeaa2}#title,#message{color:#ffe9b6}#panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:12px}.panel{background:#fffaf5;border:3px solid #d6b0df;border-radius:17px;padding:15px}.panel h2{font:700 22px Georgia;margin:0 0 12px}.panel label{display:block;font-weight:bold;margin:10px 0 5px}.panel input,.panel textarea,.panel select{width:100%;padding:10px;border:2px solid #d5addf;border-radius:8px;font:16px Trebuchet MS}.panel textarea{min-height:135px}.panel button{margin:5px}.clock{font-size:64px;color:#74429a;text-align:center;font-weight:bold}.note{font-size:13px;color:#766681}</style></head><body>
<header><h1>✨ Our Magical Classroom</h1><nav><button onclick="show('home')">🌈 Student View</button><button onclick="show('teacher')">📚 Teacher View</button><button onclick="show('academy')">🏰 Academy</button><button onclick="show('garden')">🌸 Garden</button><button onclick="show('cottage')">🧰 Tools</button></nav></header>
<main><h2 id="title"></h2><div class="scene"><img id="art" src="art/home.webp" alt="Illustrated classroom"><div id="hits"></div></div><div id="panels"></div><p id="message"></p></main><script>
const $=id=>document.getElementById(id),subs=['CKLA Skills','CKLA Knowledge','Bridges Math','Number Corner','Writing','Fun Friday'];
const titles={home:'Enchanted Learning Library',teacher:'Magical Teacher’s Study',academy:'Whimsical Learning Academy',garden:'Magical Garden',cottage:'Classroom Tools Cottage',timer:'Magical Timer',wheel:'Magical Name Wheel',groups:'Magical Group Maker',voices:'Magical Voice Levels',champs:'Magical CHAMPS',numbers:'Magical Random Number Picker',calendar:'Magical Calendar',weather:'Magical Weather Station',helpers:'Magical Helper Chart',music:'Magical Music Player',rewards:'Magical Reward Adventures',breaks:'Magical Brain Breaks',seasonal:'Magical Seasonal Fun'};
let names=JSON.parse(localStorage.getItem('omc_names')||'[]'),links=JSON.parse(localStorage.getItem('omc_links')||'{}'),schedule=localStorage.getItem('omc_schedule')||'8:00 | Morning Work\n8:20 | Number Corner\n8:40 | CKLA Skills\n9:20 | CKLA Knowledge\n10:20 | Bridges Math\n11:20 | Writing\n12:00 | Lunch\n1:10 | Centers\n2:45 | Pack Up';
function msg(s){$('message').textContent=s}function hit(x,y,w,h,dest){let b=document.createElement('button');b.className='hot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.title=dest;b.setAttribute('aria-label',dest);b.onclick=()=>dest.startsWith('lesson:')?lesson(dest.slice(7)):show(dest);$('hits').append(b)}
function panel(title,content){let d=document.createElement('div');d.className='panel';d.innerHTML='<h2>'+title+'</h2>'+content;$('panels').append(d);return d}
function show(p){$('title').textContent=titles[p];$('art').src='art/'+p+'.webp';$('art').alt=titles[p];$('hits').replaceChildren();$('panels').replaceChildren();msg('');window.scrollTo(0,0);
if(p==='home'){subs.forEach((s,i)=>hit(19+i*13,41,13,23,'lesson:'+s));[['teacher',83,2,16,11],['cottage',18,67,13,13],['rewards',31,67,13,13],['breaks',44,67,13,13],['music',57,67,13,13],['academy',70,67,13,13],['seasonal',83,67,16,13]].forEach(a=>hit(...a));panel('Welcome!','<p>Click an illustrated subject book or activity icon to explore.</p>')}
if(p==='teacher')teacher();if(p==='academy')subs.forEach((s,i)=>hit(13+i*13.9,37,13,36,'lesson:'+s));
if(p==='garden')[['breaks',1,38,22,25],['rewards',33,28,33,34],['music',77,27,22,23],['seasonal',77,53,22,23]].forEach(a=>hit(...a));
if(p==='cottage')[['timer',0,24,16,25],['wheel',17,24,17,25],['groups',34,24,16,25],['numbers',50,24,16,25],['voices',67,24,16,25],['champs',83,24,17,25],['calendar',0,55,16,25],['weather',17,55,17,25],['helpers',50,55,17,25],['music',67,55,16,25]].forEach(a=>hit(...a));
if(p==='timer')timer();if(p==='wheel')wheel();if(p==='groups')groups();if(p==='numbers')numbers();if(p==='voices')voices();if(p==='rewards')rewards();
if(p==='music'){let d=panel('Spotify','<p>Open your Spotify playlists in a separate tab.</p><button id="spotify">Open Spotify ↗</button>');d.querySelector('#spotify').onclick=()=>window.open('https://open.spotify.com/','_blank','noopener,noreferrer')}
if(['champs','calendar','weather','helpers','breaks','seasonal'].includes(p))panel('Artwork Preview','<p>The illustration is ready; editable controls for this page are coming in a later build.</p>')}
function lesson(s){show('academy');let d=panel(s,'<p>Open your original Google Slides presentation with its animations.</p><button id="open">Open Lesson ↗</button><button id="edit">Edit Lesson Links</button>');d.querySelector('#open').onclick=()=>links[s]?window.open(links[s],'_blank','noopener,noreferrer'):msg('Add this lesson link in Teacher View first.');d.querySelector('#edit').onclick=()=>show('teacher')}
function teacher(){let a=panel('Daily Schedule','<label>One activity per line: time | activity</label><textarea id="schedule"></textarea><button id="save">Save Schedule</button>');a.querySelector('textarea').value=schedule;a.querySelector('#save').onclick=()=>{schedule=a.querySelector('textarea').value;localStorage.setItem('omc_schedule',schedule);msg('Schedule saved locally.')};let b=panel('Lesson Links','<p class="note">Paste Google Slides links for your subjects.</p>'+subs.map((s,i)=>`<label>${s}</label><input id="l${i}" type="url" placeholder="Google Slides URL">`).join('')+'<button id="save">Save Links</button>');subs.forEach((s,i)=>b.querySelector('#l'+i).value=links[s]||'');b.querySelector('#save').onclick=()=>{subs.forEach((s,i)=>links[s]=b.querySelector('#l'+i).value.trim());localStorage.setItem('omc_links',JSON.stringify(links));msg('Links saved locally.')};let c=panel('Class Roster','<p class="note">One student name per line; saved in this browser only.</p><textarea></textarea><button id="save">Save Names</button>');c.querySelector('textarea').value=names.join('\n');c.querySelector('#save').onclick=()=>{names=c.querySelector('textarea').value.split('\n').map(s=>s.trim()).filter(Boolean);localStorage.setItem('omc_names',JSON.stringify(names));msg(names.length+' names saved.')}}
function timer(){let n=300,active=false,handle;let d=panel('Countdown Timer','<div class="clock" id="clock">05:00</div><label>Minutes<input type="number" id="mins" value="5" min="0" max="180"></label><button id="start">Start / Pause</button><button id="reset">Reset</button><button id="plus">+1 minute</button>');let render=()=>d.querySelector('#clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');d.querySelector('#start').onclick=()=>{active=!active;clearInterval(handle);if(active)handle=setInterval(()=>{n=Math.max(0,n-1);render();if(n===0){clearInterval(handle);active=false;msg('Time is up!')}},1000)};d.querySelector('#reset').onclick=()=>{clearInterval(handle);active=false;n=Math.max(0,Math.min(180,Number(d.querySelector('#mins').value)||0))*60;render()};d.querySelector('#plus').onclick=()=>{n+=60;render()}}
function wheel(){let d=panel('Interactive Name Wheel','<p class="note">Names are drawn sideways within their colored wedges.</p><canvas width="600" height="600" style="width:100%;max-width:500px;display:block;margin:auto"></canvas><button id="spin">Spin!</button><p id="result"></p>');let ctx=d.querySelector('canvas').getContext('2d'),angle=0,colors=['#ff93cf','#8ccaff','#9de9b7','#ffe484','#c9a4ff','#ffa57f'];function draw(){ctx.clearRect(0,0,600,600);if(!names.length){ctx.fillStyle='#75499e';ctx.font='bold 24px Georgia';ctx.textAlign='center';ctx.fillText('Add names in Teacher View',300,300);return}let step=2*Math.PI/names.length;names.forEach((name,i)=>{let a=angle+i*step-Math.PI/2;ctx.beginPath();ctx.moveTo(300,300);ctx.arc(300,300,270,a,a+step);ctx.closePath();ctx.fillStyle=colors[i%6];ctx.fill();ctx.strokeStyle='#fff3c2';ctx.stroke();ctx.save();ctx.translate(300,300);ctx.rotate(a+step/2);ctx.fillStyle='#302044';ctx.font='bold 20px Georgia';ctx.textAlign='right';ctx.fillText(name,260,6,180);ctx.restore()});ctx.fillStyle='#ffdb75';ctx.beginPath();ctx.moveTo(300,15);ctx.lineTo(283,0);ctx.lineTo(317,0);ctx.fill();ctx.beginPath();ctx.arc(300,300,38,0,7);ctx.fill();ctx.fillStyle='#6d3f8e';ctx.font='40px Georgia';ctx.textAlign='center';ctx.fillText('★',300,313)}draw();d.querySelector('#spin').onclick=()=>{if(!names.length)return;let b=d.querySelector('#spin');b.disabled=true;let start=performance.now(),base=angle,delta=(5+Math.random()*3)*Math.PI*2;function step(t){let p=Math.min(1,(t-start)/3200);angle=base+delta*(1-(1-p)**3);draw();if(p<1)requestAnimationFrame(step);else{let w=2*Math.PI/names.length;let idx=Math.floor((((-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI))/w)%names.length;d.querySelector('#result').textContent='Selected: '+names[idx];b.disabled=false}}requestAnimationFrame(step)}}
function groups(){let d=panel('Group Maker','<label>Method<select id="method"><option value="count">Number of groups</option><option value="size">Students per group</option></select></label><label>Quantity<input id="qty" type="number" min="1" value="4"></label><button id="make">Create Groups</button><div id="result"></div>');d.querySelector('#make').onclick=()=>{if(!names.length){msg('Add student names in Teacher View.');return}let q=Math.max(1,Number(d.querySelector('#qty').value)||1),count=d.querySelector('#method').value==='count'?Math.min(q,names.length):Math.ceil(names.length/q),arr=[...names].sort(()=>Math.random()-.5),groups=Array.from({length:count},()=>[]);arr.forEach((name,i)=>groups[i%count].push(name));d.querySelector('#result').textContent=groups.map((g,i)=>'Group '+(i+1)+': '+g.join(', ')).join('\n');d.querySelector('#result').style.whiteSpace='pre-line'}}
function numbers(){let d=panel('Random Number Picker','<label>From<input id="min" type="number" value="1"></label><label>To<input id="max" type="number" value="100"></label><button id="pick">Pick Number</button><div id="result" class="clock"></div>');d.querySelector('#pick').onclick=()=>{let a=Number(d.querySelector('#min').value),b=Number(d.querySelector('#max').value);if(b<a){msg('Check the number range.');return}d.querySelector('#result').textContent=Math.floor(Math.random()*(b-a+1))+a}}
function voices(){let d=panel('Voice Levels','<div id="chosen" class="clock">2</div>'+['Silent','Whisper','Table Talk','Presentation','Outside'].map((x,i)=>`<button data-v="${i}">${i} — ${x}</button>`).join(''));d.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>d.querySelector('#chosen').textContent=b.dataset.v+' — '+b.textContent.split(' — ')[1])}
function rewards(){let n=0;let d=panel('Reward Counter','<label>Adventure<select id="type"><option>Magical Treasure Chest</option><option>Rainbow Balloon Adventure</option><option>Collect the Pumpkins</option></select></label><label>Goal<input id="goal" type="number" min="1" value="20"></label><div class="clock" id="count">0 / 20</div><button id="earn">Earn One</button><button id="reset">Reset</button>');let draw=()=>d.querySelector('#count').textContent=n+' / '+d.querySelector('#goal').value;d.querySelector('#earn').onclick=()=>{n=Math.min(Number(d.querySelector('#goal').value)||20,n+1);draw();if(n>=Number(d.querySelector('#goal').value))msg('🌟 Class reward unlocked!')};d.querySelector('#reset').onclick=()=>{n=0;draw()};d.querySelector('#goal').oninput=draw}
show('home');
</script></body></html>
