<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Magical Classroom</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#160b25;font-family:Trebuchet MS,Arial;color:#49345b;overflow:hidden}main{height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center}.scene{position:relative;width:min(100vw,150dvh);max-height:100dvh;aspect-ratio:3/2;overflow:hidden}.scene img{width:100%;height:100%;object-fit:contain;display:block}.hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:10px}.hot:hover{background:transparent;box-shadow:none}.hot:focus-visible{outline:3px solid #ffe9a1;outline-offset:-3px}.schedule-live{position:absolute;left:3.0%;top:36.6%;width:14.45%;height:40.0%;z-index:2;display:flex;flex-direction:column;gap:0.45%;padding:0.6% 0.5%;background:#493025;border:2px solid #c99953;border-radius:9px;box-shadow:inset 0 0 10px #1b0b16,0 0 5px #f8d78866;overflow:hidden}.schedule-live[hidden]{display:none}.schedule-line{flex:1;min-height:0;display:flex;align-items:center;gap:2%;padding:0 3%;border-radius:5px;font-size:clamp(6px,1.05cqw,16px);line-height:1.04;color:#3c2850;font-weight:bold;overflow:hidden}.schedule-time{flex:0 0 28%;font-variant-numeric:tabular-nums;white-space:nowrap}.schedule-activity{flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}.schedule-live .schedule-line:nth-child(6n+1){background:#f8d9bf}.schedule-live .schedule-line:nth-child(6n+2){background:#f6cde8}.schedule-live .schedule-line:nth-child(6n+3){background:#ddd7fa}.schedule-live .schedule-line:nth-child(6n+4){background:#cfe8f6}.schedule-live .schedule-line:nth-child(6n+5){background:#d9ebcf}.schedule-live .schedule-line:nth-child(6n){background:#f8e8bb}.scene{container-type:inline-size}.modal[hidden]{display:none}.modal{position:fixed;inset:0;z-index:30;background:#160b25a8;display:flex;justify-content:center;align-items:center;padding:18px}.modal-window{position:relative;width:min(100%,980px);max-height:92dvh;overflow:auto;border:4px solid #e5bc71;border-radius:20px;background:#fff9f0;padding:22px 18px 18px;box-shadow:0 16px 65px #0009}.close{position:sticky;float:right;top:0;z-index:5;border:2px solid #e8c57d;background:#7a429d;color:white;border-radius:12px;padding:7px 12px;cursor:pointer;font-size:20px}.panel{padding:12px;border-bottom:2px solid #e9d6ed}.panel h2{font:700 25px Georgia;color:#76429c;margin:0 0 12px}.panel label{display:block;margin:10px 0 5px;font-weight:bold}.panel input,.panel textarea,.panel select{width:100%;padding:10px;border:2px solid #d5addf;border-radius:9px;font:16px Trebuchet MS}.panel textarea{min-height:120px}.panel button{margin:5px;padding:10px;border:2px solid #e9c47c;background:#76459c;color:white;border-radius:12px;cursor:pointer}.clock{font-size:64px;color:#74429a;text-align:center;font-weight:bold}.note{font-size:13px;color:#766681}#message{color:#704080}button:focus-visible{outline:3px solid #4fd1e7}
@media(max-aspect-ratio:3/2){.scene{width:100vw;height:66.6667vw}}@media(min-aspect-ratio:3/2){.scene{height:100dvh;width:150dvh}}
</style></head><body>
<main><div class="scene"><img id="art" src="art/home.webp" alt="Our Magical Classroom"><div id="scheduleLive" class="schedule-live" aria-label="Current classroom schedule"></div><div id="hits"></div></div><div id="modal" class="modal" hidden><div class="modal-window" role="dialog" aria-modal="true" aria-label="Classroom controls"><button class="close" id="close" aria-label="Close controls">✕</button><div id="panels"></div><p id="message" role="status"></p></div></div><span id="title" hidden></span></main><script>
const $=id=>document.getElementById(id),subs=['CKLA Skills','CKLA Knowledge','Bridges Math','Number Corner','Writing','Fun Friday'];
const titles={home:'Enchanted Learning Library',teacher:'Magical Teacher’s Study',academy:'Whimsical Learning Academy',garden:'Magical Garden',cottage:'Classroom Tools Cottage',timer:'Magical Timer',wheel:'Magical Name Wheel',groups:'Magical Group Maker',voices:'Magical Voice Levels',champs:'Magical CHAMPS',numbers:'Magical Random Number Picker',calendar:'Magical Calendar',weather:'Magical Weather Station',helpers:'Magical Helper Chart',music:'Magical Music Player',rewards:'Magical Reward Adventures',breaks:'Magical Brain Breaks',seasonal:'Magical Seasonal Fun'};
let names=JSON.parse(localStorage.getItem('omc_names')||'[]'),links=JSON.parse(localStorage.getItem('omc_links')||'{}'),schedule=localStorage.getItem('omc_schedule_v2')||'8:00 AM | Morning Work\n8:30 AM | CKLA Skills\n9:30 AM | Morning Recess\n9:50 AM | Bridges Math / Work Places\n10:40 AM | Lunch & Recess\n11:25 AM | CKLA Knowledge\n12:00 PM | Typing / IXL\n12:35 PM | Afternoon Recess\n12:55 PM | Number Corner\n1:25 PM | WIN / Reading Mastery\n2:10 PM | Stack & Pack\n2:20 PM | Activity / Specials\n3:15 PM | Dismissal';
function renderSchedule(){const board=$('scheduleLive');board.replaceChildren();for(const line of schedule.split('\n').map(s=>s.trim()).filter(Boolean)){const [time,...parts]=line.split('|');const row=document.createElement('div');row.className='schedule-line';const t=document.createElement('span');t.className='schedule-time';t.textContent=(time||'').trim().replace(/\s*(AM|PM)$/i,'');const activity=document.createElement('span');activity.className='schedule-activity';activity.textContent=parts.join('|').trim();row.append(t,activity);board.append(row)}board.hidden=($('art').getAttribute('src')!=='art/home.webp');}function msg(s){$('message').textContent=s;if(s)$('modal').hidden=false}function openControls(){ $('modal').hidden=false }function closeControls(){ $('modal').hidden=true;$('panels').replaceChildren();$('message').textContent='' }$('close').onclick=closeControls;document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').hidden)closeControls();else show('home')}});function hit(x,y,w,h,dest){let b=document.createElement('button');b.className='hot';b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;b.title=dest;b.setAttribute('aria-label',dest);b.onclick=()=>dest.startsWith('lesson:')?lesson(dest.slice(7)):dest.startsWith('teacher:')?teacher():dest.startsWith('tool:')?(dest==='tool:preview'?panel('Coming soon','<p>This area has its approved artwork; interactive activities are still being built.</p>'):dest==='tool:music'?musicControls():({timer,wheel,groups,numbers,voices,rewards})[dest.slice(5)]()):show(dest);$('hits').append(b)}
function panel(title,content){let d=document.createElement('div');d.className='panel';d.innerHTML='<h2>'+title+'</h2>'+content;$('panels').append(d);openControls();return d}
function show(p){$('title').textContent=titles[p];$('art').src='art/'+p+'.webp';$('art').alt=titles[p];renderSchedule();$('hits').replaceChildren();closeControls();
if(p!=='home')hit(0,0,12,12,'home');if(p==='home'){hit(3,35,15,44,'teacher:schedule');subs.forEach((s,i)=>hit(21.5+i*11.65,46.5,11.5,26,'lesson:'+s));[['teacher',84,17,14,10],['cottage',19,76,11,13],['rewards',30,76,11,13],['breaks',41,76,11,13],['music',52,76,11,13],['garden',63,76,11,13],['seasonal',85,76,11,13]].forEach(a=>hit(...a));}
if(p==='teacher'){hit(2,20,15,11,'home');hit(2,32,15,10,'teacher:schedule');hit(2,42,15,10,'teacher:lessons');hit(2,53,15,10,'cottage');hit(2,63,15,10,'rewards');hit(20,35,18,45,'teacher:schedule');hit(67,32,16,40,'teacher:lessons');hit(84,32,15,39,'cottage');}if(p==='academy')subs.forEach((s,i)=>hit(13+i*13.9,37,13,36,'lesson:'+s));
if(p==='garden')[['breaks',1,38,22,25],['rewards',33,28,33,34],['music',77,27,22,23],['seasonal',77,53,22,23]].forEach(a=>hit(...a));
if(p==='cottage')[['timer',0,24,16,25],['wheel',17,24,17,25],['groups',34,24,16,25],['numbers',50,24,16,25],['voices',67,24,16,25],['champs',83,24,17,25],['calendar',0,55,16,25],['weather',17,55,17,25],['helpers',50,55,17,25],['music',67,55,16,25]].forEach(a=>hit(...a));
if(p==='timer')hit(5,22,89,65,'tool:timer');if(p==='wheel')hit(25,20,50,63,'tool:wheel');if(p==='groups')hit(5,25,89,55,'tool:groups');if(p==='numbers')hit(5,25,89,55,'tool:numbers');if(p==='voices')hit(5,25,89,55,'tool:voices');if(p==='rewards')hit(5,25,89,55,'tool:rewards');
if(p==='music'){hit(24,25,55,48,'tool:music');}if(false){let d=panel('Spotify','<p>Open your Spotify playlists in a separate tab.</p><button id="spotify">Open Spotify ↗</button>');d.querySelector('#spotify').onclick=()=>window.open('https://open.spotify.com/','_blank','noopener,noreferrer')}
if(['champs','calendar','weather','helpers','breaks','seasonal'].includes(p))hit(12,25,76,55,'tool:preview');}
function musicControls(){let d=panel('Spotify','<p>Open Spotify to play your playlists.</p><button id="spotify">Open Spotify ↗</button>');d.querySelector('#spotify').onclick=()=>window.open('https://open.spotify.com/','_blank','noopener,noreferrer')}
function lesson(s){show('academy');let d=panel(s,'<p>Open your original Google Slides presentation with its animations.</p><button id="open">Open Lesson ↗</button><button id="edit">Edit Lesson Links</button>');d.querySelector('#open').onclick=()=>links[s]?window.open(links[s],'_blank','noopener,noreferrer'):msg('Add this lesson link in Teacher View first.');d.querySelector('#edit').onclick=()=>show('teacher')}
function teacher(){let a=panel('Daily Schedule','<label>One activity per line: time | activity</label><textarea id="schedule"></textarea><button id="save">Save Schedule</button>');a.querySelector('textarea').value=schedule;a.querySelector('#save').onclick=()=>{schedule=a.querySelector('textarea').value;localStorage.setItem('omc_schedule_v2',schedule);renderSchedule();msg('Schedule saved. Return to Student View to see the changes.')};let b=panel('Lesson Links','<p class="note">Paste Google Slides links for your subjects.</p>'+subs.map((s,i)=>`<label>${s}</label><input id="l${i}" type="url" placeholder="Google Slides URL">`).join('')+'<button id="save">Save Links</button>');subs.forEach((s,i)=>b.querySelector('#l'+i).value=links[s]||'');b.querySelector('#save').onclick=()=>{subs.forEach((s,i)=>links[s]=b.querySelector('#l'+i).value.trim());localStorage.setItem('omc_links',JSON.stringify(links));msg('Links saved locally.')};let c=panel('Class Roster','<p class="note">One student name per line; saved in this browser only.</p><textarea></textarea><button id="save">Save Names</button>');c.querySelector('textarea').value=names.join('\n');c.querySelector('#save').onclick=()=>{names=c.querySelector('textarea').value.split('\n').map(s=>s.trim()).filter(Boolean);localStorage.setItem('omc_names',JSON.stringify(names));msg(names.length+' names saved.')}}
function timer(){let n=300,active=false,handle;let d=panel('Countdown Timer','<div class="clock" id="clock">05:00</div><label>Minutes<input type="number" id="mins" value="5" min="0" max="180"></label><button id="start">Start / Pause</button><button id="reset">Reset</button><button id="plus">+1 minute</button>');let render=()=>d.querySelector('#clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');d.querySelector('#start').onclick=()=>{active=!active;clearInterval(handle);if(active)handle=setInterval(()=>{n=Math.max(0,n-1);render();if(n===0){clearInterval(handle);active=false;msg('Time is up!')}},1000)};d.querySelector('#reset').onclick=()=>{clearInterval(handle);active=false;n=Math.max(0,Math.min(180,Number(d.querySelector('#mins').value)||0))*60;render()};d.querySelector('#plus').onclick=()=>{n+=60;render()}}
function wheel(){let d=panel('Interactive Name Wheel','<p class="note">Names are drawn sideways within their colored wedges.</p><canvas width="600" height="600" style="width:100%;max-width:500px;display:block;margin:auto"></canvas><button id="spin">Spin!</button><p id="result"></p>');let ctx=d.querySelector('canvas').getContext('2d'),angle=0,colors=['#ff93cf','#8ccaff','#9de9b7','#ffe484','#c9a4ff','#ffa57f'];function draw(){ctx.clearRect(0,0,600,600);if(!names.length){ctx.fillStyle='#75499e';ctx.font='bold 24px Georgia';ctx.textAlign='center';ctx.fillText('Add names in Teacher View',300,300);return}let step=2*Math.PI/names.length;names.forEach((name,i)=>{let a=angle+i*step-Math.PI/2;ctx.beginPath();ctx.moveTo(300,300);ctx.arc(300,300,270,a,a+step);ctx.closePath();ctx.fillStyle=colors[i%6];ctx.fill();ctx.strokeStyle='#fff3c2';ctx.stroke();ctx.save();ctx.translate(300,300);ctx.rotate(a+step/2);ctx.fillStyle='#302044';ctx.font='bold 20px Georgia';ctx.textAlign='right';ctx.fillText(name,260,6,180);ctx.restore()});ctx.fillStyle='#ffdb75';ctx.beginPath();ctx.moveTo(300,15);ctx.lineTo(283,0);ctx.lineTo(317,0);ctx.fill();ctx.beginPath();ctx.arc(300,300,38,0,7);ctx.fill();ctx.fillStyle='#6d3f8e';ctx.font='40px Georgia';ctx.textAlign='center';ctx.fillText('★',300,313)}draw();d.querySelector('#spin').onclick=()=>{if(!names.length)return;let b=d.querySelector('#spin');b.disabled=true;let start=performance.now(),base=angle,delta=(5+Math.random()*3)*Math.PI*2;function step(t){let p=Math.min(1,(t-start)/3200);angle=base+delta*(1-(1-p)**3);draw();if(p<1)requestAnimationFrame(step);else{let w=2*Math.PI/names.length;let idx=Math.floor((((-angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI))/w)%names.length;d.querySelector('#result').textContent='Selected: '+names[idx];b.disabled=false}}requestAnimationFrame(step)}}
function groups(){let d=panel('Group Maker','<label>Method<select id="method"><option value="count">Number of groups</option><option value="size">Students per group</option></select></label><label>Quantity<input id="qty" type="number" min="1" value="4"></label><button id="make">Create Groups</button><div id="result"></div>');d.querySelector('#make').onclick=()=>{if(!names.length){msg('Add student names in Teacher View.');return}let q=Math.max(1,Number(d.querySelector('#qty').value)||1),count=d.querySelector('#method').value==='count'?Math.min(q,names.length):Math.ceil(names.length/q),arr=[...names].sort(()=>Math.random()-.5),groups=Array.from({length:count},()=>[]);arr.forEach((name,i)=>groups[i%count].push(name));d.querySelector('#result').textContent=groups.map((g,i)=>'Group '+(i+1)+': '+g.join(', ')).join('\n');d.querySelector('#result').style.whiteSpace='pre-line'}}
function numbers(){let d=panel('Random Number Picker','<label>From<input id="min" type="number" value="1"></label><label>To<input id="max" type="number" value="100"></label><button id="pick">Pick Number</button><div id="result" class="clock"></div>');d.querySelector('#pick').onclick=()=>{let a=Number(d.querySelector('#min').value),b=Number(d.querySelector('#max').value);if(b<a){msg('Check the number range.');return}d.querySelector('#result').textContent=Math.floor(Math.random()*(b-a+1))+a}}
function voices(){let d=panel('Voice Levels','<div id="chosen" class="clock">2</div>'+['Silent','Whisper','Table Talk','Presentation','Outside'].map((x,i)=>`<button data-v="${i}">${i} — ${x}</button>`).join(''));d.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>d.querySelector('#chosen').textContent=b.dataset.v+' — '+b.textContent.split(' — ')[1])}
function rewards(){let n=0;let d=panel('Reward Counter','<label>Adventure<select id="type"><option>Magical Treasure Chest</option><option>Rainbow Balloon Adventure</option><option>Collect the Pumpkins</option></select></label><label>Goal<input id="goal" type="number" min="1" value="20"></label><div class="clock" id="count">0 / 20</div><button id="earn">Earn One</button><button id="reset">Reset</button>');let draw=()=>d.querySelector('#count').textContent=n+' / '+d.querySelector('#goal').value;d.querySelector('#earn').onclick=()=>{n=Math.min(Number(d.querySelector('#goal').value)||20,n+1);draw();if(n>=Number(d.querySelector('#goal').value))msg('🌟 Class reward unlocked!')};d.querySelector('#reset').onclick=()=>{n=0;draw()};d.querySelector('#goal').oninput=draw}
$('art').addEventListener('error',()=>{document.body.dataset.imageError='true';});show('home');
</script></body></html>
